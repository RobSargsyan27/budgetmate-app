<div class="container-fluid">
  <h1 class="h3 mb-4 text-gray-800 analytics fw-bold">Analytics</h1>

  <div class="row d-flex justify-content-center mb-3">
    <nav class="navbar navbar-expand bg-light rounded-4 shadow-sm px-3 py-2 justify-content-center align-items-center">
      <div class="d-flex align-items-center gap-3">
        <a id="previousMonthOverview" class="btn btn-sm btn-light border rounded-circle px-2"><i class="fas fa-chevron-left"></i></a>
        <h6 class="m-0 ml-4 mr-4 font-weight-bold dark-blue" id="overviewDates"></h6>
        <a id="nextMonthOverview" class="btn btn-sm btn-light border rounded-circle px-2"><i class="fas fa-chevron-right"></i></a>
      </div>
    </nav>
  </div>

  <div class="row d-flex justify-content-center text-center">
    <div class="col-xl-5 col-lg-6">
      <div class="card shadow-sm rounded-4 border-0 mb-4">
        <div class="card-header bg-light border-0 py-3 text-center rounded-top-4">
          <h6 class="m-0 font-weight-bold dark-blue analytics.expenseOverview">Expense Overview</h6>
        </div>
        <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center">
          <i class="fas fa-receipt fa-2x text-gray-300 mb-2"></i>
          <div class="h5 mb-0 font-weight-bold text-gray-800" id="expenseOverview"></div>
        </div>
      </div>
    </div>

    <div class="col-xl-5 col-lg-6">
      <div class="card shadow-sm rounded-4 border-0 mb-4">
        <div class="card-header bg-light border-0 py-3 text-center rounded-top-4">
          <h6 class="m-0 font-weight-bold dark-blue analytics.earningsOverview">Earnings Overview</h6>
        </div>
        <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center">
          <i class="fas fa-wallet fa-2x text-gray-300 mb-2"></i>
          <div class="h5 mb-0 font-weight-bold text-gray-800" id="earningsOverview"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="row d-flex justify-content-center text-center">
    <div class="col-xl-5 col-lg-6">
      <div class="card shadow-sm rounded-4 border-0 mb-4">
        <div class="card-header bg-light border-0 py-3 text-center rounded-top-4">
          <h6 class="m-0 font-weight-bold dark-blue analytics.cashFlow">Cash Flow</h6>
        </div>
        <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center">
          <i class="fas fa-donate fa-2x text-gray-300 mb-2"></i>
          <div class="h5 mb-0 font-weight-bold" id="cashFlow"></div>
        </div>
      </div>
    </div>

    <div class="col-xl-5 col-lg-6" style="height: 100%">
      <div class="card shadow-sm rounded-4 border-0 mb-4">
        <div class="card-header bg-light border-0 py-3 text-center rounded-top-4">
          <h6 class="m-0 font-weight-bold dark-blue analytics.outlook">Cash Flow Outlook</h6>
        </div>
        <div class="card-body px-4 py-4">
          <i class="fas fa-sack-dollar fa-2x text-gray-300 mb-2"></i>
          <div class="progress-oppose progress-lg rounded-4">
            <div class="progress-bar bg-success" role="progressbar" id="outlookProgressBar" style="width: 50%" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row d-flex justify-content-center text-center" id="adminData"></div>

  <div class="row d-flex justify-content-center">
    <div class="col-xl-10 col-lg-12">
      <div class="card rounded-4 border-0 shadow-sm mb-4">
        <div class="card-header bg-light border-0 py-3 d-flex flex-column align-items-center rounded-top-4">
          <h5 class="m-2 font-weight-bold dark-blue text-center analytics.cashFlow">Expense Chart</h5>
          <div class="d-flex flex-row align-items-center gap-3">
            <a id="previousMonthExpenseLineChart" class="btn btn-sm btn-light border rounded-circle px-2"><i class="fas fa-chevron-left"></i></a>
            <h6 class="m-0 ml-4 mr-4 font-weight-bold dark-blue analytics.expenseLineChart"></h6>
            <a id="nextMonthExpenseLineChart" class="btn btn-sm btn-light border rounded-circle px-2"><i class="fas fa-chevron-right"></i></a>
          </div>
          <span id="expensesLineChartDate" class="text-muted mt-2"></span>
        </div>
        <div class="card-body p-4">
          <div class="chart-area d-flex justify-content-center">
            <canvas id="expensesLineChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="col-xl-10 col-lg-12">
      <div class="card rounded-4 border-0 shadow-sm mb-4">
        <div class="card-header bg-light border-0 py-3 d-flex flex-column align-items-center rounded-top-4">
          <h5 class="m-2 font-weight-bold dark-blue text-center analytics.cashFlow">Earnings Chart</h5>
          <div class="d-flex flex-row align-items-center gap-3">
            <a id="previousMonthEarningLineChart" class="btn btn-sm btn-light border rounded-circle px-2"><i class="fas fa-chevron-left"></i></a>
            <h6 class="m-0 ml-4 mr-4 font-weight-bold dark-blue analytics.earningsLineChart"></h6>
            <a id="nextMonthEarningLineChart" class="btn btn-sm btn-light border rounded-circle px-2"><i class="fas fa-chevron-right"></i></a>
          </div>
          <span id="earningsLineChartDate" class="text-muted mt-2"></span>
        </div>
        <div class="card-body p-4">
          <div class="chart-area d-flex justify-content-center">
            <canvas id="earningsLineChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
