<div class="container-fluid" id="recordsHistoryContainer">
  <h1 class="h3 mb-4 text-gray-800 recordsHistory fw-bold">Records History</h1>

  <div class="card border-0 shadow-sm rounded-4 mb-4" id="recordsHistoryTableCard">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between mb-3">
        <button class="btn btn-primary px-4 generateReport d-flex align-items-center gap-2" id="recordReportButton">
          <i class="fas fa-file-download"></i>
          <span>Generate Report</span>
        </button>
        <button class="btn btn-primary px-4 recordHistory.applyFilters d-flex align-items-center gap-2" id="recordsApplyFilters">
          <i class="fas fa-filter"></i>
          <span>Apply Filters</span>
        </button>
      </div>

      <hr class="mb-4">

      <div class="table-responsive">
        <div class="row g-3 mb-3">
          <div class="col-md-auto d-flex align-items-center gap-2">
            <label for="recordsPerPageSelect" class="form-label recordsPerPage mb-0">Per Page</label>
            <select id="recordsPerPageSelect" class="form-select form-select-sm">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="25">25</option>
              <option value="50">50</option>
            </select>
          </div>

          <div class="col-md-auto d-flex align-items-center gap-2">
            <label for="recordTypeSelect" class="form-label record.category mb-0">Category</label>
            <select id="recordTypeSelect" class="form-select form-select-sm">
              <option class="recordHistory.all" value="all">All</option>
              <option class="recordHistory.income" value="income">Income</option>
              <option class="recordHistory.expense" value="expense">Expense</option>
              <option class="recordHistory.transfer" value="transfer">Transfer</option>
            </select>
          </div>

          <div class="col-md-auto d-flex align-items-center gap-2">
            <label for="timestampStartFilter" class="form-label timestamp mb-0">Date</label>
            <input type="date" id="timestampStartFilter" class="form-control form-control-sm">
            <span>-</span>
            <input type="date" id="timestampEndFilter" class="form-control form-control-sm">
          </div>

          <div class="col-md-auto d-flex align-items-center gap-2">
            <label for="amountStartFilter" class="form-label amount mb-0">Amount</label>
            <input type="number" id="amountStartFilter" class="form-control form-control-sm" placeholder="Min">
            <span>-</span>
            <input type="number" id="amountEndFilter" class="form-control form-control-sm" placeholder="Max">
          </div>
        </div>

        <table class="table table-hover table-striped align-middle" id="recordsHistoryTable">
          <thead class="table-light">
          <tr>
            <th class="amount">Amount</th>
            <th class="record.type">Record Type</th>
            <th class="record.category">Category</th>
            <th class="currency">Currency</th>
            <th class="record.paymentTime">Payment Time</th>
            <th class="receivingAccount">Receiving Account</th>
            <th class="withdrawalAccount">Withdrawal Account</th>
          </tr>
          </thead>
          <tbody id="recordsHistoryTableBody"></tbody>
        </table>

        <div class="d-flex justify-content-center mt-3">
          <nav>
            <ul class="pagination pagination-sm mb-0" id="paginationControls"></ul>
          </nav>
        </div>
      </div>
    </div>
  </div>
</div>
