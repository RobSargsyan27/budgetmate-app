<div class="container-fluid">
  <h1 class="h3 mb-4 text-gray-800 profile fw-bold">Profile</h1>

  <div class="col-lg-12 d-flex flex-column">
    <div class="card border-0 shadow-sm rounded-4 p-4">
      <div class="d-flex flex-column">
        <div class="d-flex flex-row align-items-center justify-content-between mb-3">
          <div class="d-flex flex-row align-items-center gap-3">
            <h4 id="profileAvatar" class="prf-avatar dark-blue-avatar">A</h4>
            <div class="fw-bold fs-5" id="profileUsername">Username</div>
            <span class="badge bg-info text-dark p-2" id="profileRole">Role</span>
          </div>
          <a class="btn btn-danger btn-lg rounded-3 deleteAccount" id="deleteAccountButton">Delete Account</a>
        </div>

        <form id="updateProfileForm" class="gd-1 gd-gap1 mt-4">
          <div>
            <label for="updateFirstname" class="form-label d-flex align-items-center gap-1">
              <i class="fas fa-asterisk fa-xs text-danger"></i>
              <span class="profile.firstname">First Name</span>
            </label>
            <input class="form-control form-control-lg rounded-3" id="updateFirstname" type="text">
          </div>

          <div>
            <label for="updateLastname" class="form-label d-flex align-items-center gap-1">
              <i class="fas fa-asterisk fa-xs text-danger"></i>
              <span class="profile.lastname">Last Name</span>
            </label>
            <input class="form-control form-control-lg rounded-3" id="updateLastname" type="text">
          </div>

          <div>
            <label for="updateCountry" class="form-label profile.country">Country</label>
            <input class="form-control form-control-lg rounded-3" id="updateCountry" type="text">
          </div>

          <div>
            <label for="updateAddress" class="form-label profile.address">Address</label>
            <input class="form-control form-control-lg rounded-3" id="updateAddress" type="text">
          </div>

          <div>
            <label for="updateCity" class="form-label profile.city">City</label>
            <input class="form-control form-control-lg rounded-3" id="updateCity" type="text">
          </div>

          <div>
            <label for="updatePostalCode" class="form-label profile.postalCode">Postal Code</label>
            <input class="form-control form-control-lg rounded-3" id="updatePostalCode" type="text">
          </div>

          <div class="d-flex flex-row align-items-center mt-2">
            <label for="updateAvatarColor" class="form-label profile.avatarColor me-3">Avatar Color</label>
            <input class="form-control form-control-color form-control-lg wd-1" id="updateAvatarColor" type="color" value="#ff5733">
          </div>

          <button id="submitButton" class="btn btn-primary btn-lg rounded-3 mt-4 gd-r1 profile.save" type="submit">Save</button>
        </form>
      </div>
    </div>
  </div>
</div>
